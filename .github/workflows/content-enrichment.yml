# Retest JSON/base64 GitHub README decoding.
name: Content Enrichment - Manual Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-enrichment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch two articles and two README excerpts (no AI calls)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.core import hn_search, dedup
          from src.github_source import github_discover
          from src.content_enrichment import enrich
          from src.core import TOPICS
          items = dedup(
              hn_search(TOPICS["ai"], limit=2)
              + github_discover("ai", limit=2)
          )
          output = [enrich(item) for item in items]
          Path("output").mkdir(exist_ok=True)
          Path("output/enriched.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding="utf-8")
          counts = {}
          for item in output:
              key = item["source"] + ":" + item["body_status"]
              counts[key] = counts.get(key, 0) + 1
          print("ENRICHMENT_STATUS=" + json.dumps(counts, sort_keys=True))
          print("ENRICHED_CHARS=" + str(sum(len(i["body_excerpt"]) for i in output)))
          if not any(i["body_status"] == "ok" for i in output):
              raise SystemExit("No source content was successfully extracted")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-enrichment
          path: output/
          retention-days: 7
