# One-time live diagnostic: triggers ONLY when this workflow file itself changes.
name: Diagnose NVIDIA and Publish Once - 2026-11-11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-nvidia-live-20261111.yml'
permissions:
  contents: read
concurrency:
  group: technology-digest-publish
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline regression tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Neon smoke check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Live AI digest and Discord (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENABLE_REAL_AI: 'true'
          SEND_DISCORD: 'true'
        run: python -u -m src.editorial_digest
