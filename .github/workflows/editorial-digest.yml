# Verify dated RSS coverage, category embeds, and offline tests.
# Re-run offline editorial tests after fixing fenced JSON test.
name: Editorial Tech Briefing - Manual Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-digest.yml'
  workflow_dispatch:
    inputs:
      send_discord:
        description: Send classified embeds to Discord (manual opt-in only)
        type: boolean
        default: false
      live_ai:
        description: Run AI selection and drafting (up to 7 requests)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Collect metadata and optionally run NVIDIA editorial
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENABLE_REAL_AI: ${{ inputs.live_ai == true && 'true' || 'false' }}
          SEND_DISCORD: ${{ inputs.send_discord == true && inputs.live_ai == true && 'true' || 'false' }}
        run: python -m src.editorial_digest
# No cron, no database, no saved reports/artifacts.
