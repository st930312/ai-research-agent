# Retest with industry RSS and category-quota backfill; Discord disabled.
name: Editorial Digest - One-Time Live Preview

# One-time onboarding verification. No schedule, Discord send disabled.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-live-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Select and write a categorized editorial preview using NVIDIA
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ENABLE_REAL_AI: 'true'
          SEND_DISCORD: 'false'
        run: python -u -m src.editorial_digest
# No database or daily report artifact.
