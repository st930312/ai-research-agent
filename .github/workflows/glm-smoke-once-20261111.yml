name: GLM Model Smoke Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glm-smoke-once-20261111.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke-test GLM JSON with no Discord or DB
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_TIMEOUT_SECONDS: '40'
        run: |
          python - <<'PY'
          from src import editorial_digest as e
          print("GLM_TEST_START", flush=True)
          raw = e._request_ai([
            {"role": "system", "content": "Return ONLY a valid JSON object with ok true."},
            {"role": "user", "content": "Respond with {\"ok\":true}."}
          ], 512, {"calls":0,"latencies":[]}, model="z-ai/glm-5.3-flash")
          obj = e._parse_json(raw)
          assert obj.get("ok") is True, "GLM_BAD_JSON"
          print("GLM_TEST_OK", flush=True)
          PY
