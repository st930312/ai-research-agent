# Single-use acceptance test for today's fix. Not scheduled.
name: Live NVIDIA JSON and Discord Acceptance - 2026-11-12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-verify-20261112.yml'
permissions:
  contents: read
concurrency:
  group: technology-digest-publish
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python + 101 regression tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Neon smoke check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Run actual briefing and publish only after validation
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENABLE_REAL_AI: 'true'
          SEND_DISCORD: 'true'
        run: python -u -m src.editorial_digest
