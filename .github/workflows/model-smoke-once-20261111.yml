# One-time non-publishing smoke test of both NVIDIA-hosted models.
name: Model Smoke DeepSeek and GLM Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-smoke-once-20261111.yml'
permissions:
  contents: read
jobs:
  verify-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test both models without Discord or history writes
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          from src import editorial_digest as e
          for name in (e.MODEL, e.FALLBACK_MODEL):
              print("MODEL_SMOKE_START", name, flush=True)
              metrics = {"calls": 0, "latencies": []}
              try:
                  raw = e._request_ai([
                      {"role": "system", "content": "Return only strict JSON: {\"ok\":true}"},
                      {"role": "user", "content": "Return the requested JSON object."}
                  ], max_tokens=256, metrics=metrics, model=name)
                  parsed = e._parse_json(raw)
                  if parsed.get("ok") is not True:
                      raise ValueError("unexpected JSON fields")
                  print("MODEL_SMOKE_OK", name, flush=True)
              except Exception as exc:
                  print("MODEL_SMOKE_FAILED", name, type(exc).__name__, str(exc)[:250], flush=True)
                  raise
          PY
