# Retry after removing strict numeric fact guard; triggered by this one workflow-file change.
name: One-time Discord Digest - 2026-11-10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-discord-20261110.yml']
permissions:
  contents: read
concurrency:
  group: technology-digest-publish
  cancel-in-progress: false
jobs:
  publish-once:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests and compile validation
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Neon migration and smoke check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Publish one live digest to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENABLE_REAL_AI: "true"
          SEND_DISCORD: "true"
        run: python -u -m src.editorial_digest
