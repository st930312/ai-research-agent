name: Large NVIDIA Model Probe 2026-11-12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-large-nvidia-once-20261112.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe 120B candidate without Discord or DB changes
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,time,re
          model="nvidia/nemotron-3.5-super-vl-120b-a12b"
          print("PROBE_MODEL="+model,flush=True)
          body={"model":model,"messages":[{"role":"user","content":'Only respond with this JSON: {"ok":true}'}],"stream":False,"max_tokens":1024,"chat_template_kwargs":{"enable_thinking":False}}
          req=urllib.request.Request("https://integrate.api.nvidia.com/v1/chat/completions",data=json.dumps(body).encode(),headers={"Authorization":"Bearer "+os.environ["NVIDIA_API_KEY"],"Content-Type":"application/json","Accept":"application/json"},method="POST")
          t=time.monotonic()
          try:
            with urllib.request.urlopen(req,timeout=35) as resp:
              result=json.loads(resp.read(100000).decode())
              ch=(result.get("choices") or [{}])[0]
              content=(ch.get("message") or {}).get("content") or ""
              print("PROBE_HTTP="+str(resp.status),flush=True)
              print("PROBE_FINISH="+str(ch.get("finish_reason")),flush=True)
              print("PROBE_CONTENT="+repr(content[:800]),flush=True)
              print("PROBE_JSON_OK="+str(bool(re.search(r'\{\s*"ok"\s*:\s*true\s*\}',content))),flush=True)
          except urllib.error.HTTPError as exc:
            print("PROBE_HTTP_ERROR="+str(exc.code),flush=True)
            print("PROBE_BODY="+repr(exc.read(1000).decode(errors="replace")),flush=True)
          except Exception as exc:
            print("PROBE_ERROR="+type(exc).__name__+":"+str(exc)[:240],flush=True)
          print("PROBE_SECONDS="+str(round(time.monotonic()-t,2)),flush=True)
          PY
