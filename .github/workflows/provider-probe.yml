name: AI Provider One-Time Probe

# No cron. Auto-runs when the workflow file is first added/modified.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        provider: [nvidia, zai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Single minimal API request (no retries)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python -m src.provider_probe ${{ matrix.provider }}
