name: Python CI - Editorial Digest
on:
  push:
    branches: [main, improve-reliability-observability-20261110]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
