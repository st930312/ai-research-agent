name: Stock preview - review only (one-shot, no ledger)
on:
  push:
    branches: [fix/stock-early-session-context-20261121]
    paths: ['.github/workflows/stock-preview-test.yml']
permissions:
  contents: read
concurrency:
  group: stock-preview-human-review
  cancel-in-progress: false
jobs:
  send-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests before preview
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -q
      - name: Generate and send a SINGLE clearly labeled preview to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_STOCK_PREVIEW: "true"
        run: python -u -m src.stock_preview
