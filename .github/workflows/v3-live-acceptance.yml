# 2026-11-09 manual acceptance: send today's dated V3 briefing to Discord once.
# Third acceptance attempt: tolerant first-object JSON parser with added unit test.
# Retry after bounded 180-second NVIDIA read timeout and latest gaming filter.
name: V3 One-Time Live Discord Acceptance

# One-time end-to-end acceptance. Trigger only when this workflow is edited.
# No schedule, and no repeat on updates to source code.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v3-live-acceptance.yml']

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tests
        run: python -m unittest discover -s tests -v
      - name: Run V3 editorial and send approved wide messages to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENABLE_REAL_AI: "true"
          SEND_DISCORD: "true"
        run: python -u -m src.editorial_digest
