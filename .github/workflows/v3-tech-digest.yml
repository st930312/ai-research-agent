name: Technology Briefing - Daily 08:30 Asia/Taipei

on:
  schedule:
    # GitHub Actions uses UTC: 00:30 UTC = 08:30 Asia/Taipei (UTC+8).
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      live_ai:
        type: boolean
        default: false
        description: "Run real NVIDIA editing (up to 7 API calls)"
      send_discord:
        type: boolean
        default: false
        description: "Send the generated wide-format briefing to Discord"

permissions:
  contents: read

concurrency:
  group: technology-digest-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and test application
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Neon PostgreSQL smoke check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Sources and optional NVIDIA / Discord
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Scheduled runs publish automatically. Manual runs remain opt-in.
          ENABLE_REAL_AI: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_ai)) && 'true' || 'false' }}
          SEND_DISCORD: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_ai && inputs.send_discord)) && 'true' || 'false' }}
        run: python -u -m src.editorial_digest
