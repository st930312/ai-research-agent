# One-time correction for the 2026-11-09 V4.2 incomplete Discord summaries.
# Only the previously selected finance and gaming stories; never reselect or
# re-record published events. No cron or repeat trigger.
name: V4.2 Repair Incomplete Game and Industry Bodies

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v42-body-repair.yml']

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Test Neon schema and transaction rollback
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Regenerate and send two complete summaries only if validated
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: 'true'
        run: python -u -m src.repair_v42_roundups
