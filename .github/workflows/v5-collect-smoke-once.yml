name: V5 Real Collection Smoke (No AI or Discord)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-collect-smoke-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect all three sources concurrently; never call NVIDIA or Discord
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_REAL_AI: 'false'
          SEND_DISCORD: 'false'
        run: python -u -m src.digest_v5
