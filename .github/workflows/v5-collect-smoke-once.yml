name: V5 Stock Source-Checked Preview (No Discord)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-collect-smoke-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check fact-audited stock briefing without Discord or Neon writes
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SEND_DISCORD: 'false'
        run: |
          python -u - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from src.digest_services import StockService
          from src.ai_scheduler import AIRequestScheduler
          from src import editorial_digest as e
          e.configure_ai_scheduler(AIRequestScheduler(min_interval=1))
          service = StockService()
          result = service.build(service.collect(), [], datetime.now(ZoneInfo("Asia/Taipei")))
          assert len(result.messages) == 1
          assert len(result.messages[0]) <= 1900
          print("STOCK_PREVIEW_OK", len(result.messages[0]), flush=True)
          print(result.messages[0], flush=True)
          PY
