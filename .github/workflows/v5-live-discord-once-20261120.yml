name: V5 One-time Live Discord Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-live-discord-once-20261120.yml'
permissions:
  contents: read
concurrency:
  group: technology-digest-publish
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Verify Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Run V5 and send real Discord digest
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENABLE_REAL_AI: 'true'
          SEND_DISCORD: 'true'
        run: python -u -m src.digest_v5
