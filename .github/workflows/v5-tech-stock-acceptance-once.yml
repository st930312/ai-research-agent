name: V5 Tech Stock Live Discord Send (Once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-tech-stock-acceptance-once.yml'
permissions:
  contents: read
concurrency:
  group: technology-digest-publish
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify 117+ regression tests
        run: python -m unittest discover -s tests -v
      - name: Send verified Tech and Stock digests to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: 'true'
        run: |
          python -u - <<'PY'
          from src.digest_v5 import DigestOrchestrator
          from src.digest_services import TechService, StockService
          DigestOrchestrator(services=[TechService(), StockService()]).run(
              live_ai=True, send_discord=True)
          PY
