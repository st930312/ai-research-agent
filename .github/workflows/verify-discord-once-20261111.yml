# One-time live acceptance check. Triggered only when this YAML is created or updated.
name: One-time Discord Acceptance - 2026-11-11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-discord-once-20261111.yml'
permissions:
  contents: read
concurrency:
  group: technology-digest-publish
  cancel-in-progress: false
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run offline tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Check Neon schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.published_history
      - name: Generate and send one live digest
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENABLE_REAL_AI: 'true'
          SEND_DISCORD: 'true'
        run: python -u -m src.editorial_digest
