name: AI Models - One-Time Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zai-endpoint-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Probe ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        provider: [zai, nvidia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exactly one model request, no retry
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m src.provider_probe ${{ matrix.provider }}
